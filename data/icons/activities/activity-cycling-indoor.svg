<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- large drive wheel -->
  <circle cx="8" cy="12" r="3.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <!-- trainer stand legs -->
  <path d="M4.5 14.5 L8 12 L11.5 14.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- seat post -->
  <line x1="8" y1="8.5" x2="6" y2="6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- seat -->
  <line x1="4.5" y1="6" x2="7.5" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- handlebar stem -->
  <line x1="8" y1="8.5" x2="10" y2="6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- handlebar -->
  <line x1="9" y1="6" x2="11.5" y2="5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- rider head -->
  <circle cx="5.5" cy="4.5" r="1.5" fill="currentColor"/>
</svg>
