  <!-- Cycle app icon: a Shimano Ultegra-style crankset on a Tour de France
       yellow tile (GNOME Yellow 2->4). 48T ring, four-arm asymmetric spider
       (arms at crank +-40deg/+-140deg), 36T small ring behind the windows,
       alloy crank arm; greys from the GNOME HIG palette.
       Generated geometry - regenerate via a script rather than hand-editing
       the polygon points.
       NOTE: keep <?xml ...?> as the very first bytes and comments INSIDE the
       root element, or gdk-pixbuf format sniffing (appstream compose,
       GNOME Shell) fails to recognise the file. -->

