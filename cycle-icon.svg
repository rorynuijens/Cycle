<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background gradient: GNOME blue, top-left to bottom-right -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#4a90d9"/>
      <stop offset="100%" stop-color="#1553a0"/>
    </linearGradient>
    <!-- Subtle top-shine highlight -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
    <!-- Bolt glow: bloom behind the lightning bolt -->
    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Rim shadow -->
    <filter id="rimShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ── Background ─────────────────────────────────────────────── -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bgGrad)"/>
  <!-- top highlight -->
  <rect x="4" y="4" width="120" height="64"  rx="26" fill="url(#shine)"/>

  <!-- ── Wheel rim ──────────────────────────────────────────────── -->
  <!-- shadow ring (depth) -->
  <circle cx="64" cy="65" r="46" fill="none"
          stroke="#000000" stroke-opacity="0.22" stroke-width="9"/>
  <!-- tyre -->
  <circle cx="64" cy="64" r="46" fill="none"
          stroke="#ffffff" stroke-opacity="0.96" stroke-width="6.5"/>

  <!-- ── 8 Spokes (hub at 64,64 → inner tyre edge r≈43) ────────── -->
  <!--
    Endpoint formula: (64 + 43·sin θ, 64 − 43·cos θ)
      0°   → (64,    21   )
      45°  → (94.4,  33.6 )
      90°  → (107,   64   )
      135° → (94.4,  94.4 )
      180° → (64,    107  )
      225° → (33.6,  94.4 )
      270° → (21,    64   )
      315° → (33.6,  33.6 )
  -->
  <g stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.72">
    <line x1="64"   y1="64"   x2="64"   y2="21"  />
    <line x1="64"   y1="64"   x2="94.4" y2="33.6"/>
    <line x1="64"   y1="64"   x2="107"  y2="64"  />
    <line x1="64"   y1="64"   x2="94.4" y2="94.4"/>
    <line x1="64"   y1="64"   x2="64"   y2="107" />
    <line x1="64"   y1="64"   x2="33.6" y2="94.4"/>
    <line x1="64"   y1="64"   x2="21"   y2="64"  />
    <line x1="64"   y1="64"   x2="33.6" y2="33.6"/>
  </g>

  <!-- ── Inner track ring (subtle chainring echo) ───────────────── -->
  <circle cx="64" cy="64" r="30" fill="none"
          stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>

  <!-- ── Lightning bolt ────────────────────────────────────────── -->
  <!--
    6-point polygon, centred at (64, 64):
      leftmost x=50, rightmost x=78 → midpoint 64 ✓
      topmost  y=24, bottommost y=104 → midpoint 64 ✓
    Clockwise from top:
      (68,24) top
      (50,66) mid-left outer
      (63,66) mid-left inner  (step right at waist)
      (60,104) bottom tip
      (78,62) mid-right outer
      (65,62) mid-right inner (step left at waist)
  -->
  <polygon points="68,24 50,66 63,66 60,104 78,62 65,62"
           fill="#f9c42a"
           filter="url(#boltGlow)"
           stroke="#d4920a" stroke-width="0.8" stroke-linejoin="round"/>

  <!-- ── Hub ────────────────────────────────────────────────────── -->
  <!-- outer white ring -->
  <circle cx="64" cy="64" r="8.5" fill="#ffffff" fill-opacity="0.97"/>
  <!-- coloured centre (matches background) -->
  <circle cx="64" cy="64" r="5"   fill="#1e5eb5"/>
  <!-- axle dot -->
  <circle cx="64" cy="64" r="2"   fill="#ffffff" fill-opacity="0.65"/>
</svg>
