# cargo-deny configuration — see https://embarkstudios.github.io/cargo-deny/
# Run locally with: cargo deny check

[advisories]
version = 2
# Fail on yanked crates; vulnerabilities are denied by default.
yanked = "deny"
ignore = []

[licenses]
version = 2
# Allow-list of acceptable licenses. cargo-deny will name any crate whose license
# is not listed here — add genuinely-acceptable ones as the dependency tree grows.
# This list reflects what a GTK4 + tokio + reqwest(rustls) tree actually pulls in.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    # webpki-roots ships Mozilla's CA bundle (via reqwest's rustls-tls) under this
    # permissive data license.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

# The Cycle binary crate is not published and has no `license` field of its own —
# skip license checks for the workspace's own crate. (Add a `license`/`license-file`
# to Cargo.toml if you later want it covered too.)
private = { ignore = true }

[bans]
# Duplicate versions of the same crate bloat the build but are rarely actionable
# in a large GTK tree — surface them as a warning, not a hard failure.
multiple-versions = "warn"
wildcards = "allow"

[sources]
# Only allow dependencies from crates.io; flag anything from an unknown registry
# or git source so a supply-chain change can't slip in unnoticed.
unknown-registry = "deny"
unknown-git = "deny"
